name: CI

# CI runs the SAME script the pre-commit hook and every agent runs. There is exactly one
# definition of "green" in this repository, and it lives in scripts/check.sh.
#
# NOTE: scripts/*.sh must be executable IN THE GIT INDEX, or this job dies with
# "Permission denied", exit 126 — see docs/GOTCHAS.md. Verify with `git ls-files -s scripts`.

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:

jobs:
  gates:
    name: check.sh (build + tests + boundary gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # {{TOOLCHAIN_SETUP_STEP}}

      - name: Run gates
        run: ./scripts/check.sh
